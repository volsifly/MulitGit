[package]
name = "mulitgit-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native GPUI desktop client for the MulitGit repository workbench"

[dependencies]
gpui = { version = "=0.2.2" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
urlencoding = "2"

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
